# Set the server port for Railway
server.port=${PORT:8080}

# --- Database Configuration ---
# These values will be provided by Railway
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# This is important: 'update' will create/update your tables when the app starts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Mail Configuration ---
# These will be set in the Railway dashboard
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- JWT Secret Key ---
# This will also be set in the Railway dashboard
JWT_SECRET_KEY=${JWT_SECRET}

FRONTEND_URL=${FRONTEND_APP_URL}